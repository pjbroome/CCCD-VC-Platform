# Fly config for the VC Portal backend (separate from Sutton's sutton-api-watchdog app).
# Deploy: fly deploy -c fly.vc.toml -a cccd-vc-backend
app = "cccd-vc-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  RAG_ENABLED = "false"          # VC portal doesn't need the embedding matrix — keeps memory low
  REVIEW_EMAIL = "pjbroome@gmail.com"

[mounts]
  source = "vc_data"             # persistent volume — slide catalog/images survive deploys
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"   # suspend (not stop) → sub-second resume if an extra machine is ever spun under load
  auto_start_machines = true
  min_machines_running = 1         # keep ONE machine always warm — no cold-start for the patient-acquisition path

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
