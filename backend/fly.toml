# fly.toml app configuration file generated for cccd-vc-backend on 2026-08-04T22:00:20-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cccd-vc-backend'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  RAG_ENABLED = 'false'
  REVIEW_EMAIL = 'pjbroome@gmail.com'

[[mounts]]
  source = 'vc_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
